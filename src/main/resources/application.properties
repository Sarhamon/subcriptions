# 애플리케이션 이름. 로그/Actuator 등 식별 용도로 사용.
spring.application.name=subcriptions
# 학교 실습 환경에서 8080이 점거된 경우가 있어 8081로 회피.
server.port=8081

# 한글 인코딩 (UTF-8 강제) — 요청/응답/템플릿/메시지 전체에 일관 적용.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mustache.charset=UTF-8
spring.messages.encoding=UTF-8

# H2 인메모리 DB. 콘솔 활성화 + 고정 DB명으로 매 실행 동일한 접속 URL 유지.
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:subecodb
spring.datasource.generate-unique-name=false

# Hibernate가 테이블 생성을 끝낸 뒤에 data.sql이 실행되도록 강제.
spring.jpa.defer-datasource-initialization=true

# 학습용 SQL 로깅 (쿼리 + 포맷팅 + 바인딩 값)
# 콘솔 출력량이 매우 많아 평소엔 OFF. 디버깅이 필요할 때만 # 제거하여 활성화.
#logging.level.org.hibernate.SQL=DEBUG
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
